version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7-jammy
    container_name: codesync-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codesync-network

  # CodeSync Backend API & WebSocket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codesync-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/codesync
      - JWT_SECRET=super_secret_production_jwt_key_codesync_2026
      - JWT_EXPIRES_IN=24h
      - CLIENT_URL=http://localhost:5173
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      - mongo
    networks:
      - codesync-network

  # CodeSync Frontend React SPA (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codesync-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - codesync-network

networks:
  codesync-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
